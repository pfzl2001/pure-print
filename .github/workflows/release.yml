name: Release

# 发版触发方式:
#   git tag v1.8.1 && git push origin v1.8.1
# 也可以在 Actions 页面手动运行(workflow_dispatch),默认只构建不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (otherwise build artifacts only)'
        type: boolean
        default: false
      test_tag:
        description: 'Tag name to use when publishing from a manual run'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.test_tag || 'ci-build' }}

jobs:
  build-android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis and regression tests
        run: |
          dart analyze lib
          dart run tool/test_layout.dart
          dart run tool/test_drop_files.dart
          dart run tool/test_office_font.dart

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PUREPRINT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PUREPRINT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PUREPRINT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pure-print-release.jks"
          chmod 600 "$RUNNER_TEMP/pure-print-release.jks"
          echo "PUREPRINT_KEYSTORE_PATH=$RUNNER_TEMP/pure-print-release.jks" >> "$GITHUB_ENV"
          echo "PUREPRINT_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PUREPRINT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/pure-print-release.jks" \
            -storepass "$STORE_PASSWORD" -alias pureprint | grep -E 'Owner:|SHA256:' || true

      - name: Build arm64 APK
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=APP_VERSION="$VERSION"

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "out/pure_print-${RELEASE_TAG}-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  build-windows:
    name: Windows x64 zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pdfx 与 printing 在 CMake configure 阶段各自下载不同版本的 pdfium,
      # 且默认共用同一个 download_project 前缀。预下载 + 补丁让构建稳定可复现。
      - name: Prefetch pdfium binaries
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pdfium'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $targets = @(
            @{ Uri = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/4690/pdfium-win-x64.tgz'; File = 'pdfium-4690.tgz' },
            @{ Uri = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/5200/pdfium-win-x64.tgz'; File = 'pdfium-5200.tgz' }
          )
          foreach ($t in $targets) {
            $dest = Join-Path $dir $t.File
            curl.exe -fL --retry 3 --retry-delay 5 -o $dest $t.Uri
            if ($LASTEXITCODE -ne 0) { throw "pdfium download failed: $($t.Uri)" }
            $size = (Get-Item $dest).Length
            if ($size -lt 100000) { throw "pdfium archive looks truncated: $dest ($size bytes)" }
            Write-Host "$($t.File): $size bytes"
          }

      - name: Patch plugin CMake files
        shell: pwsh
        run: python tool/patch_windows_plugins.py

      - name: Build Windows release
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pdfium'
          $env:PUREPRINT_LOCAL_PDFIUM = (Join-Path $dir 'pdfium-4690.tgz').Replace('\','/')
          $env:PUREPRINT_LOCAL_PDFIUM_PRINTING = (Join-Path $dir 'pdfium-5200.tgz').Replace('\','/')
          $version = $env:RELEASE_TAG.TrimStart('v')
          flutter build windows --release --dart-define=APP_VERSION=$version

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $src = 'build\windows\x64\runner\Release\*'
          $zip = "out\pure_print-windows-$env:RELEASE_TAG-x64.zip"
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: out/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../RELEASE_NOTES.md <<'EOF'
          ## 自动构建产物

          本 Release 由 GitHub Actions 从对应 tag 的源码自动构建,产物与源码严格一致。

          - `pure_print-windows-<tag>-x64.zip`:Windows x64,解压后直接运行 `pure_print.exe`(含全部 DLL 与 `data/`,勿单独拷贝 exe)。
          - `pure_print-<tag>-arm64.apk`:Android,仅 `arm64-v8a`;安装需允许「未知来源」。

          APK 自 v1.8.4 起使用正式签名(CN=pfzl2001, SHA256 11:29:DC:AE:16:05:12:CF:75:F3:03:41:5F:6D:81:75:16:34:14:B0:9F:CA:20:4E:25:72:1B:4C:B2:67:6C:F3)。
          从 v1.8.0–v1.8.3 的调试签名升级时,系统会拒绝覆盖安装,**必须先卸载旧版再安装新版**(本地设置会丢失)。
          `.docx` / `.xlsx` 为简化排版转换,IPP 客户端针对不同打印机固件可能需要适配。

          ### SHA-256

          ```
          EOF
          cat SHA256SUMS.txt >> ../RELEASE_NOTES.md
          cat >> ../RELEASE_NOTES.md <<'EOF'
          ```

          校验:`sha256sum -c SHA256SUMS.txt`。源码、许可证与构建说明见仓库 README。
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS.txt

  sync-gitee:
    name: Sync Gitee mirror
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build mirror files and push to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi
          APK=$(ls dist/*.apk)
          ZIP=$(ls dist/*.zip)
          APK_NAME=$(basename "$APK")
          ZIP_NAME=$(basename "$ZIP")
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          # publish job 在手动验证时会被跳过,校验和必须在这里自行生成
          printf '%s  %s\n%s  %s\n' "$APK_SHA" "$APK_NAME" "$ZIP_SHA" "$ZIP_NAME" > SHA256SUMS.txt
          VERSION="${RELEASE_TAG#v}"
          BASE="https://gitee.com/pfzl12/pure-print-mirror/raw/master"
          cat > version.json <<EOF
          {
            "tag": "$RELEASE_TAG",
            "version": "$VERSION",
            "apk": "$APK_NAME",
            "apkSha256": "$APK_SHA",
            "apkSize": $(stat -c%s "$APK"),
            "windows": "$ZIP_NAME",
            "windowsSha256": "$ZIP_SHA",
            "windowsSize": $(stat -c%s "$ZIP"),
            "notes": "$VERSION 自动发布,已同步 GitHub Release;校验值见 SHA256SUMS.txt。",
            "updated": "$(date -u +%Y-%m-%d)",
            "source": "https://github.com/pfzl2001/pure-print",
            "baseUrl": "$BASE",
            "apkUrl": "$BASE/$APK_NAME",
            "windowsUrl": "$BASE/$ZIP_NAME"
          }
          EOF
          API="https://gitee.com/api/v5/repos/pfzl12/pure-print-mirror/contents"
          upload() {
            local path="$1" file="$2"
            # base64 正文可达数十 MB,必须写入文件再用 @file 传给 curl,
            # 不能作为命令行参数(会触发 Argument list too long)。
            base64 -w0 "$file" > /tmp/gitee_content.b64
            local sha=""
            local existing=$(curl -sS -H "Authorization: token $GITEE_TOKEN" \
              "$API/$path?ref=master")
            sha=$(printf '%s' "$existing" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")')
            if [ -n "$sha" ]; then
              python3 -c 'import json,sys; tag=sys.argv[1]; sha=sys.argv[2]; print(json.dumps({"content":sys.stdin.read(),"sha":sha,"message":"sync "+tag,"branch":"master"}))' "$RELEASE_TAG" "$sha" < /tmp/gitee_content.b64 > /tmp/gitee_payload.json
            else
              python3 -c 'import json,sys; tag=sys.argv[1]; print(json.dumps({"content":sys.stdin.read(),"message":"sync "+tag,"branch":"master"}))' "$RELEASE_TAG" < /tmp/gitee_content.b64 > /tmp/gitee_payload.json
            fi
            local code=$(curl -sS -o /tmp/gitee_resp.json -w '%{http_code}' -X POST \
              "$API/$path" -H "Authorization: token $GITEE_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/gitee_payload.json)
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "upload $path failed: HTTP $code"; cat /tmp/gitee_resp.json; return 1
            fi
            echo "uploaded $path (sha=${sha:-new})"
          }
          upload "$APK_NAME" "$APK"
          upload "$ZIP_NAME" "$ZIP"
          upload "SHA256SUMS.txt" "SHA256SUMS.txt"
          upload "version.json" "version.json"
